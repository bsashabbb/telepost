<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Редактировать статью</title>
    <script>
        // Функция проверки заполненности полей
        function checkForm() {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const submitButton = document.getElementById('submit-button');

            // Если поля заполнены, активируем кнопку
            if (title !== '' && content !== '' && title.length >= 5 && content.length >= 10) {
                submitButton.classList.add('active');
                submitButton.disabled = false;
            } else {
                submitButton.classList.remove('active');
                submitButton.disabled = false;
                event.preventDefault();
            }
        }

        // Показать кастомный confirm
        function customConfirm(message) {
            return new Promise((resolve) => {
                const confirmMessage = document.getElementById('customConfirmMessage');
                confirmMessage.textContent = message;
                document.getElementById('customConfirmOverlay').style.display = 'flex';

                // Обработчики для кнопок "ОК" и "Отмена"
                document.getElementById('customConfirmOK').onclick = function () {
                    resolve(true); // Возвращаем true
                    hideCustomConfirm();
                };

                document.getElementById('customConfirmCancel').onclick = function () {
                    resolve(false); // Возвращаем false
                    hideCustomConfirm();
                };
            });
        }

        // Скрыть кастомный confirm
        function hideCustomConfirm() {
            document.getElementById('customConfirmOverlay').style.display = 'none';
        }

        // Функция для возврата к просмотру поста
        async function back() {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            try {
                const response = await fetch('/raw/{{ post_id }}');
                const rawText = await response.text(); // Получаем raw-текст
                const safeText = rawText.replace(/`/g, '\\`'); // Экранируем обратные кавычки
                const rawPageContent = safeText; // Сохраняем raw-код в переменную

                if (title === '{{ title }}' && content === rawPageContent) {
                    window.location.href = '/post/{{ post_id }}';
                } else {
                    const result = await customConfirm('Вы уверены, что хотите вернуться к просмотру поста? Изменения не сохранятся.');
                    if (result) {
                        window.location.href = '/post/{{ post_id }}';
                    }
                }
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        // Функция для перехода на главную страницу
        async function goToMain() {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            try {
                const response = await fetch('/raw/{{ post_id }}');
                const rawText = await response.text(); // Получаем raw-текст
                const safeText = rawText.replace(/`/g, '\\`'); // Экранируем обратные кавычки
                const rawPageContent = safeText; // Сохраняем raw-код в переменную

                // Сравниваем текущие значения с исходными
                if (title === '{{ title }}' && content === rawPageContent) {
                    window.location.href = '/';
                } else {
                    const result = await customConfirm('Вы уверены, что хотите перейти на главную страницу? Изменения не сохранятся.');
                    if (result) {
                        window.location.href = '/';
                    }
                }
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        // Добавляем проверку форм при вводе текста
        document.addEventListener('DOMContentLoaded', function () {
            const titleInput = document.getElementById('title');
            const contentInput = document.getElementById('content');

            titleInput.addEventListener('input', checkForm);
            contentInput.addEventListener('input', checkForm);

            // Устанавливаем начальную высоту для заголовка
            titleInput.style.height = 'auto';
            titleInput.style.height = titleInput.scrollHeight + 'px';

            // Автоматическое изменение высоты для заголовка
            titleInput.addEventListener('input', () => {
                titleInput.style.height = 'auto';
                titleInput.style.height = titleInput.scrollHeight + 'px';
            });

            // Отключаем перенос строки по нажатию Enter для заголовка
            titleInput.addEventListener('keydown', function (event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Отменяем действие по умолчанию (перенос строки)
                }
            });
        });
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Стили для текстовых полей */
        .input-field, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.5;
            resize: none; /* Отключаем ручное изменение размера */
            overflow: hidden; /* Скрываем полосу прокрутки */
            background-color: #f9f9f9;
            transition: all 0.3s ease;
            white-space: pre-wrap; /* Автоматический перенос текста */
            word-wrap: break-word; /* Перенос длинных слов */
        }

        .input-field:focus, textarea:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        /* Стили для оверлея */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        /* Стили для кастомного confirm */
        .confirm-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .confirm-box p {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .confirm-box button {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #customConfirmOK {
            background: #007BFF;
            color: white;
        }

        #customConfirmOK:hover {
            background: #0056b3;
        }

        #customConfirmCancel {
            background: #f1f1f1;
            color: #333;
        }

        #customConfirmCancel:hover {
            background: #ddd;
        }

        @media (max-width: 768px) {
            #title, #content {
                font-size: 14px;
            }

            .confirm-box, .alert-box {
                width: 90%;
            }
        }
    </style>
</head>
<body>
{% include 'header.html' %}
<h1>Редактировать статью</h1>
<form method="POST">
    {{ form.hidden_tag() }}  <!-- CSRF-токен -->
    <label for="title">Заголовок:</label>
    <textarea id="title" name="title" class="input-field" rows="1" placeholder="Заголовок..." minlength="5" maxlength="150" required>{{ title | e }}</textarea><br><br>

    <label for="content">Содержание:</label>
    <textarea id="content" name="content" rows="10" placeholder="Содержание..." minlength="10" required>{{ content | e }}</textarea><br><br>

    <!-- Кнопка "Сохранить изменения", изначально неактивная -->
    <button type="button" onclick="back()" class="back-button">Назад</button>
    <button type="submit" id="submit-button" class="save-button" disabled>Сохранить изменения</button>
</form>

<!-- Кнопка возврата -->
<button onclick="goToMain()" class="to-main">На главную</button>

<!-- Оверлей и кастомный confirm -->
<div id="customConfirmOverlay" class="overlay">
    <div id="customConfirm" class="confirm-box">
        <p id="customConfirmMessage">Вы уверены?</p>
        <button id="customConfirmOK">ОК</button>
        <button id="customConfirmCancel">Отмена</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const contentTextarea = document.getElementById('content');

        // Автоматическое расширение текстового поля для содержания
        contentTextarea.addEventListener('input', () => {
            contentTextarea.style.height = 'auto';
            contentTextarea.style.height = contentTextarea.scrollHeight + 'px';
        });

        // Устанавливаем начальную высоту для содержания
        contentTextarea.style.height = 'auto';
        contentTextarea.style.height = contentTextarea.scrollHeight + 'px';
    });
</script>
</body>
</html>
